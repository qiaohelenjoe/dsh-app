name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (typecheck + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm run test
        working-directory: server
        env:
          TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:55432/postgres

  plugin:
    name: plugin (typecheck + unit + client UI + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # 插件 typecheck 会检查 ../server 的集成测试依赖，两个 lockfile 都要进缓存
          cache-dependency-path: |
            server/package-lock.json
            plugin/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: plugin
      - run: npm run typecheck
        working-directory: plugin
      - run: npm run test:unit
        working-directory: plugin
      - run: npm run check:client
        working-directory: plugin
      - run: npm run build
        working-directory: plugin

  mobile:
    name: mobile (analyze + widget tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: mobile
      - run: flutter test
        working-directory: mobile

  adapt:
    name: mobile-adapt (jsdom layout tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-adapt/package-lock.json
      - run: npm ci
        working-directory: mobile-adapt
      - run: npm test
        working-directory: mobile-adapt
