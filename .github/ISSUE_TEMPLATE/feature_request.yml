name: 功能建议
description: 提出一个功能或改进建议
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: 相关范围
      options:
        - 服务端 server
        - 桌面插件 plugin（隧道/面板）
        - 移动端 mobile（Android 壳）
        - 窄屏适配 mobile-adapt
        - 部署 deploy
        - 文档
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述现有体验里不舒服的地方，而不是先给方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 可选；如果你有实现思路也可以写在这里

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
