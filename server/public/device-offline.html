<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>设备离线 · DSH 移动端</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    .card { max-width: 420px; padding: 28px 24px; text-align: center; line-height: 1.7; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 8px; opacity: 0.8; }
    button { margin-top: 16px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>这台设备当前不在线</h1>
    <p>请确认该电脑已开机、DSH 桌面端已运行，并且账号仍处于登录状态。</p>
    <p>连接恢复后刷新本页即可继续。</p>
    <button onclick="location.reload()">重新加载</button>
  </div>
</body>
</html>
