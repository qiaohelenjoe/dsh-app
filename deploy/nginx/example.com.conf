# DSH 账号服务站点模板（容器 8787，TLS 由宿主机 nginx 终止）
#
# 部署方法：复制本文件到 /etc/nginx/conf.d/，把 example.com 换成你的域名、
# 把 ssl.conf 换成你自己的证书片段路径：
#   sed 's/example.com/你的域名/g; s#/etc/nginx/snippets/ssl.conf#/etc/nginx/snippets/ssl-wildcard.conf#' \
#       deploy/nginx/example.com.conf > /etc/nginx/conf.d/你的域名.conf
#   /usr/local/nginx/sbin/nginx -t && /usr/local/nginx/sbin/nginx -s reload

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name example.com;

    # 生产改成你自己的证书片段（示例：/etc/nginx/snippets/ssl-wildcard.conf）
    include /etc/nginx/snippets/ssl.conf;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 2m;

    # 健康检查只给本机/内网看，避免公网暴露数据库状态与 schema 版本
    location = /healthz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
