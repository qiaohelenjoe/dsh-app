name: dsh_mobile
description: DSH 移动端壳（登录、设备列表、DSH Web UI 容器）
publish_to: "none"
version: 1.0.1+26

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.10
  http: ^1.2.2
  shared_preferences: ^2.3.2
  webview_flutter: ^4.9.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/deepseek-mark.svg
  fonts:
    - family: BrandFont
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
